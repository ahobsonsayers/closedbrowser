services:
  closedbrowser:
    container_name: closedbrowser
    image: arranhs/closedbrowser:latest
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./data/user-data:/user-data
      - ./data/downloads:/downloads
    environment:
      - TZ=Europe/London
      - TOKEN=1234567890 # set a token to require auth on all endpoints
      # - DATA_DIR=
      # - DOWNLOAD_DIR=
