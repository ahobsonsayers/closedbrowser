services:
  closedbrowser:
    container_name: closedbrowser
    image: arranhs/closedbrowser:latest
    restart: unless-stopped
    shm_size: 1g # required to prevent crashes
    ports:
      - 3000:3000
    volumes:
      - ./data/user-data:/user-data
      - ./data/downloads:/downloads
    environment:
      - TZ=Europe/London
