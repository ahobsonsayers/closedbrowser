# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  format:
    cmds:
      - shfmt -w -i 2 -sr -s **/*.sh
      - chmod +x **/*.sh

  lint:
    cmds:
      - shellcheck **/*.sh

  build:
    cmds:
      - docker build -f api.dockerfile . --tag arranhs/closedbrowser:latest

  build:no-cache:
    cmds:
      - docker build -f api.dockerfile . --tag arranhs/closedbrowser:latest --no-cache

  build:app:
    cmds:
      - docker build -f app.dockerfile . --tag arranhs/closedbrowser-app:latest

  run:init:
    cmds:
      - mkdir -p ./data

  run:
    deps: [run:init]
    cmds:
      - docker compose up

  run:daemon:
    deps: [run:init]
    cmds:
      - docker compose up -d

  test:
    cmds:
      - task: test:rebrowser
      - task: test:sannysoft
      - task: test:creepjs

  test:rebrowser:
    cmds:
      - ./tests/test-rebrowser.sh

  test:sannysoft:
    cmds:
      - ./tests/test-sannysoft.sh

  test:creepjs:
    cmds:
      - ./tests/test-creepjs.sh

  skills:install:
    desc: Install skills
    deps: [skills:remove]
    cmds:
      - mkdir -p ~/.agents/skills
      - for skill in ./skills/*/; do ln -sfr "$skill" ~/.agents/skills/; done

  skills:remove:
    desc: Remove skills
    cmds:
      - mkdir -p ./skills
      - for skill in ./skills/*/; do rm -f ~/.agents/skills/"$(basename "$skill")"; done
