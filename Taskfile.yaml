# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  format:
    cmds:
      - shfmt -w -i 2 -sr -s **/*.sh
      - chmod +x **/*.sh

  lint:
    cmds:
      - shellcheck **/*.sh

  build:
    cmds:
      - docker build -f api.dockerfile . --tag arranhs/closedbrowser:latest

  build:no-cache:
    cmds:
      - docker build -f api.dockerfile . --tag arranhs/closedbrowser:latest --no-cache

  build:app:
    cmds:
      - docker build -f app.dockerfile . --tag arranhs/closedbrowser-app:latest

  run:init:
    cmds:
      - mkdir -p ./data

  run:
    deps: [run:init]
    cmds:
      - docker compose up

  run:daemon:
    deps: [run:init]
    cmds:
      - docker compose up -d

  test:
    cmds:
      - task: test:rebrowser
      - task: test:sannysoft
      - task: test:creepjs

  test:rebrowser:
    cmds:
      - ./tests/test-rebrowser.sh

  test:sannysoft:
    cmds:
      - ./tests/test-sannysoft.sh

  test:creepjs:
    cmds:
      - ./tests/test-creepjs.sh

  skill:install:
    desc: Copy skill to global agents
    cmds:
      - mkdir -p ~/.config/opencode/agents
      - cp -r skills/closedbrowser ~/.config/opencode/agents/

  skill:install:symlink:
    desc: Symlink skill to global agents
    cmds:
      - mkdir -p ~/.config/opencode/agents
      - ln -sfr skills/closedbrowser ~/.config/opencode/agents/
