name: Update Application Version

on:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 1am
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Get current digest
        id: get-current-digest
        run: |
          CURRENT_DIGEST=$(grep "^ARG BLITZBROWSER_DIGEST=" Dockerfile | cut -d '=' -f2)

          echo "digest=$CURRENT_DIGEST" >> $GITHUB_OUTPUT

          echo "Current application digest: $CURRENT_DIGEST"

      - name: Get latest digest
        id: get-latest-digest
        run: |
          LATEST_DIGEST=$(docker buildx imagetools inspect ghcr.io/blitzbrowser/blitzbrowser:latest --format '{{.Digest}}')

          echo "digest=$LATEST_DIGEST" >> $GITHUB_OUTPUT

          echo "Latest application digest: $LATEST_DIGEST"

      - name: Compare and update digest
        id: compare-update
        run: |
          if [ "$CURRENT_DIGEST" != "$LATEST_DIGEST" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi
        env:
          CURRENT_DIGEST: ${{ steps.get-current-digest.outputs.digest }}
          LATEST_DIGEST: ${{ steps.get-latest-digest.outputs.digest }}

      - name: Update Dockerfile
        if: steps.compare-update.outputs.needs_update == 'true'
        run: |
          sed -i "s|ARG BLITZBROWSER_DIGEST=.*|ARG BLITZBROWSER_DIGEST=$LATEST_DIGEST|" Dockerfile
        env:
          LATEST_DIGEST: ${{ steps.get-latest-digest.outputs.digest }}

      - name: Commit and push
        if: steps.compare-update.outputs.needs_update == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "Update blitzbrowser digest to $LATEST_DIGEST"
          git push
        env:
          LATEST_DIGEST: ${{ steps.get-latest-digest.outputs.digest }}
