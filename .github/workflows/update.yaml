name: Update Browserless Version

on:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 1am
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get current version
        id: get-current-version
        run: |
          CURRENT_BROWSERLESS_VERSION=$(
            grep "^FROM ghcr.io/browserless/chromium" Dockerfile |
            cut -d ':' -f2
          )

          echo "browserless=$CURRENT_BROWSERLESS_VERSION" >> $GITHUB_OUTPUT

          echo "
          Current browserless version: $CURRENT_BROWSERLESS_VERSION
          "

      - name: Get latest version
        id: get-latest-version
        run: |
          LATEST_BROWSERLESS_VERSION=$(
            curl -s "https://api.github.com/repos/browserless/browserless/tags?per_page=1" | 
            jq -r '.[0].name'
          )

          echo "browserless=$LATEST_BROWSERLESS_VERSION" >> $GITHUB_OUTPUT

          echo "
          Latest browserless version: $LATEST_BROWSERLESS_VERSION
          "

      - name: Compare and update version
        id: compare-update
        run: |
          if [ "$CURRENT_BROWSERLESS_VERSION" != "$LATEST_BROWSERLESS_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi
        env:
          CURRENT_BROWSERLESS_VERSION: ${{ steps.get-current-version.outputs.browserless }}
          LATEST_BROWSERLESS_VERSION: ${{ steps.get-latest-version.outputs.browserless }}

      - name: Update Dockerfile
        if: steps.compare-update.outputs.needs_update == 'true'
        run: |
          sed -i "s|FROM ghcr.io/browserless/chromium:.*|FROM ghcr.io/browserless/chromium:$BROWSERLESS_VERSION|" Dockerfile
        env:
          BROWSERLESS_VERSION: ${{ steps.get-latest-version.outputs.browserless }}

      - name: Commit and push
        if: steps.compare-update.outputs.needs_update == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "Update browserless to $BROWSERLESS_VERSION"
          git push
        env:
          BROWSERLESS_VERSION: ${{ steps.get-latest-version.outputs.browserless }}
