name: Build & Push Images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yaml
      - api.dockerfile
      - app.dockerfile
      - scripts/**
      - patches/**
  workflow_dispatch:
    inputs:
      tag:
        description: Custom tag to push
        required: false
        default: ""

jobs:
  prepare:
    name: Prepare tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: tags
        run: |
          TAGS="latest"
          if [ -n "$CUSTOM_TAG" ]; then
            TAGS="latest
          $CUSTOM_TAG"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}

  build-api:
    name: Build API image
    needs: prepare
    uses: ahobsonsayers/github-workflows/.github/workflows/docker-build-push.yaml@main
    secrets: inherit
    with:
      dockerfile: api.dockerfile
      image-name: arranhs/closedbrowser
      image-tags: ${{ needs.prepare.outputs.tags }}
      skip-arm-build: true

  build-app:
    name: Build App image
    needs: prepare
    uses: ahobsonsayers/github-workflows/.github/workflows/docker-build-push.yaml@main
    secrets: inherit
    with:
      dockerfile: app.dockerfile
      image-name: arranhs/closedbrowser-app
      image-tags: ${{ needs.prepare.outputs.tags }}
      skip-arm-build: true
